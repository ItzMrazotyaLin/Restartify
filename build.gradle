plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'xyz.jpenilla.run-paper' version '3.1.0'
}

group = project.group
version = project.version
description = project.description

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.20-R0.1-SNAPSHOT'

    // Adventure and MiniMessage are bundled with Paper API,
    // declared explicitly so the project compiles in IDEs without a server classpath.
    compileOnly 'net.kyori:adventure-api:4.14.0'
    compileOnly 'net.kyori:adventure-text-minimessage:4.14.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.withType(AbstractCopyTask).configureEach {
    filteringCharset = 'UTF-8'
}

// Preserve UTF-8 characters in resources when filtering plugin.yml.
tasks.named('processResources') {
    def pluginTokens = [
            '${name}'    : project.name,
            '${version}' : project.version.toString(),
            '${authors}' : project.findProperty('authors') ?: 'itzmr',
    ]
    inputs.properties(pluginTokens)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    // String replacement instead of expand(): encoding is explicitly controlled by filteringCharset (UTF-8),
    // preventing character corruption on Windows.
    filesMatching('plugin.yml') {
        filter { String line ->
            String result = line
            pluginTokens.each { token, value -> result = result.replace(token, value) }
            result
        }
    }
}

tasks.named('jar') {
    manifest {
        attributes(
                'Implementation-Title'   : project.name,
                'Implementation-Version' : project.version,
                'Specification-Vendor'   : 'itzmr'
        )
    }
}

// All dependencies are declared as compileOnly (provided by the server),
// so shadowJar does not relocate packages — Adventure must not be relocated,
// otherwise components cannot be serialized by the server.
tasks.named('shadowJar') {
    archiveClassifier = 'shadow'
    mergeServiceFiles()
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

// Minecraft 1.20.6 requires Java 21, while the plugin targets Java 17,
// so a separate launcher is configured for the dev server.
tasks.named('runServer') {
    minecraftVersion '1.20.6'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    jvmArgs '-Xms1G', '-Xmx2G'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
