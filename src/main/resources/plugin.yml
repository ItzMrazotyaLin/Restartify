name: ${name}
version: '${version}'
main: org.itzmr.restartify.Restartify
api-version: '1.20'
description: Restartify - предупреждение игроков о рестарте сервера с BossBar и Adventure
author: ${authors}
website: https://github.com/itzmr
load: POSTWORLD

# Внимание: команда /restart намеренно не регистрируется.
# Она встроена в ядро (org.spigotmc.RestartCommand), и её перехват приводил к
# зацикливанию рестарта. Используйте /reboot — он запускает таймер и сам
# вызывает нативный Bukkit.spigot().restart().
commands:
  reboot:
    description: Запустить таймер перезапуска сервера.
    usage: /reboot [start|cancel|reload]
    aliases: [ rb ]
    permission: restartify.admin

permissions:
  restartify.admin:
    description: Позволяет запускать и отменять перезапуск сервера.
    default: op