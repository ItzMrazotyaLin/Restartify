# ==========================================================================
#  Restartify - текстовые сообщения
# ==========================================================================
#  Плейсхолдеры:
#    %sender%   - кто запустил/отменил рестарт (ник игрока или "Console")
#    %time%     - оставшееся время в формате MM:SS (или H:MM:SS)
#    %seconds%  - оставшееся время в секундах
#    %total%    - длительность отсчёта в секундах
#    %progress% - сколько процентов отсчёта осталось
#    %error%    - текст ошибки (только в command-error)
#
#  Форматирование: MiniMessage (<red>, <bold>, <gradient:#ff0000:#0000ff>)
#  + классические коды (&c, &l, &#RRGGBB) одновременно.
# ==========================================================================

settings:
  # Добавлять prefix в начало сообщений в чат (на BossBar префикс не влияет).
  prefix-enabled: true

prefix: "<gray>[</gray><gradient:#ff5f6d:#ffc371><bold>Restartify</bold></gradient><gray>]</gray> "

no-permission: "<red>У вас нет прав на использование этой команды."
usage: "<gray>Использование: <white>/reboot <gray>[cancel|reload]"

# --- Обратный отсчёт -----------------------------------------------------
started: "<gray>Рестарт запущен: <white>%sender%<gray>, перезапуск через <white>%time%<gray>."
announcement: "<red><bold>Внимание!</bold></red> <gray>Сервер будет перезапущен через <white>%time%"
already-running: "<yellow>Рестарт уже запланирован. Осталось <white>%time%<gray>."
restarting: "<red><bold>Перезапуск...</bold></red> <gray>Сервер перезагружается, ожидайте."

# --- Отмена --------------------------------------------------------------
not-running: "<yellow>Обратный отсчёт не запущен."
canceled: "<gray>Отсчёт отменён: <white>%sender%<gray>, оставалось <white>%time%<gray>."
canceled-broadcast: "<yellow>Перезапуск сервера <red>отменён<yellow>."

# --- Служебное -----------------------------------------------------------
reload-success: "<green>Конфигурация Restartify успешно перезагружена."
reload-failed: "<red>Не удалось перезагрузить конфигурацию. Подробности в консоли."
command-error: "<red>Ошибка при выполнении команды рестарта: <white>%error%"

# --- BossBar -------------------------------------------------------------
bossbar:
  title: "<red><bold>Рестарт через</bold> <white>%time%"