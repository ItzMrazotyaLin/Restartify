# ==========================================================================
#  Restartify - messages
# ==========================================================================
#  Placeholders:
#    %sender%   - who started/cancelled the restart (player name or "Console")
#    %time%     - remaining time formatted as MM:SS (or H:MM:SS)
#    %seconds%  - remaining time in seconds
#    %total%    - total countdown duration in seconds
#    %progress% - percentage of countdown remaining
#    %error%    - error details (only used in restart-fallback)
#
#  Formatting: MiniMessage (<red>, <bold>, <gradient:#ff0000:#0000ff>)
#  and legacy codes (&c, &l, &#RRGGBB) are supported simultaneously.
# ==========================================================================

settings:
  # Prepend prefix to chat messages (does not affect the BossBar).
  prefix-enabled: true

prefix: "<gray>[</gray><gradient:#ff5f6d:#ffc371><bold>Restartify</bold></gradient><gray>]</gray> "

no-permission: "<red>You do not have permission to use this command."
usage: "<gray>Usage: <white>/reboot <gray>[start|cancel|reload]"

# --- Countdown ------------------------------------------------------------
started: "<gray>Restart initiated by <white>%sender%<gray>, restarting in <white>%time%<gray>."
announcement: "<red><bold>Attention!</bold></red> <gray>The server will restart in <white>%time%"
already-running: "<yellow>A restart is already scheduled. Time remaining: <white>%time%<gray>."
restarting: "<red><bold>Restarting...</bold></red> <gray>The server is restarting, please wait."

# --- Cancellation ---------------------------------------------------------
not-running: "<yellow>No restart countdown is currently running."
canceled: "<gray>Countdown cancelled by <white>%sender%<gray> with <white>%time%<gray> remaining."
canceled-broadcast: "<yellow>Server restart has been <red>cancelled<yellow>."

# --- Service --------------------------------------------------------------
reload-success: "<green>Restartify configuration successfully reloaded."
reload-failed: "<red>Failed to reload configuration. Check console for details."
restart-fallback: "<red>Native restart is not supported by this server core, shutting down instead: <white>%error%"

# --- BossBar --------------------------------------------------------------
bossbar:
  title: "<red><bold>Restarting in</bold> <white>%time%"
