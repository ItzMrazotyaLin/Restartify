# ==========================================================================
#  Restartify - конфигурация
# ==========================================================================
#  Весь текст поддерживает ОДНОВРЕМЕННО:
#    * MiniMessage-теги:  <red>, <bold>, <gradient:#ff0000:#0000ff>, <#RRGGBB>
#    * Legacy-коды:       &c, &l, &#RRGGBB
# ==========================================================================

commands:
  # Встроенная команда Bukkit/Paper /restart (org.spigotmc.RestartCommand)
  # перезаписывает команды плагинов, поэтому /reboot и /restart — это
  # РАЗНЫЕ команды, и без этого флага /restart продолжит перезапускать
  # сервер встроенным способом. Поставьте false, если /restart на сервере
  # уже занят сторонним плагином рестарта.
  override-builtin-restart: true

# Длительность обратного отсчёта в секундах (минимум 1).
countdown:
  seconds: 60

# Чатовые сообщения во время обратного отсчёта.
# false  - игроки увидят только BossBar (оповещения админам и ответы на команды
#          продолжат отправляться, чтобы команда не выглядела «мёртвой»).
chat:
  enabled: true

# Когда отправлять сообщения игрокам.
announce:
  # INTERVAL  - каждые announce.interval-seconds секунд (60, 45, 30, 15 ...).
  # SCHEDULE  - только на секундах из списка announce.seconds ниже.
  # OFF       - не отправлять сообщения вовсе (BossBar продолжает работать).
  mode: INTERVAL
  interval-seconds: 15
  seconds:
    - 60
    - 30
    - 15
    - 10
    - 5
    - 4
    - 3
    - 2
    - 1

# BossBar обратного отсчёта (Adventure BossBar).
bossbar:
  enabled: true
  # Цвет: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
  color: RED
  # Стиль (Adventure BossBar.Overlay): SOLID, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20
  # (SOLID — сплошная заливка, в Adventure этот стиль называется PROGRESS)
  overlay: SOLID
  # Затемнять экран, пока виден BossBar (косметика).
  darken-screen: true

# Действие, выполняемое после окончания отсчёта.
restart:
  # COMMAND  - выполнить restart.command от имени консоли.
  # SHUTDOWN - вызвать Bukkit.shutdown().
  action: COMMAND
  # Команда рестарта. Ведущий слэш допускается и будет срезан.
  command: restart
  # Задержка в тиках перед выполнением рестарта (20 тиков = 1 секунда),
  # чтобы игроки успели увидеть финальное сообщение.
  delay-ticks: 20
  # Дополнительно выключить сервер после выполнения restart.command.
  shutdown-after-command: false